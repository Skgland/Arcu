name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install latest stable
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2.7.3

    - name: Check Rustfmt
      run: cargo fmt -- --check

    - name: Check Clippy
      run: cargo clippy

    - name: Check semver
      uses: obi1kenobi/cargo-semver-checks-action@v2


  read-msrv:
    runs-on: ubuntu-latest
    outputs:
      msrv: ${{ steps.read-declared-msrv.outputs.msrv }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: read-declared-msrv
        name: Read msrv from Cargo.toml rust_version field
        run: echo "msrv=$(cargo metadata  --no-deps --format-version  1 | jq -r '.packages[] | select(.name = "arcu") | ."rust_version"')" >>  "$GITHUB_OUTPUT"

  build:
    strategy:
      matrix:
        channel: ["stable", "beta", "${{ needs.read-msrv.outputs.msrv }}"]
        include:
          - { channel: "nightly", components: "miri"}
    needs: [lint, read-msrv]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install latest stable
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{matrix.channel}}
        components: ${{matrix.components}}

    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2.7.3

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Run miri
      if: matrix.channel == 'nightly'
      run: cargo miri test --verbose
